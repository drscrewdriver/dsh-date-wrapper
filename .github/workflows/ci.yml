# CI baseline for dsh-date-wrapper.
# Generated 2026-11-05. Chain: install -> lint -> test -> verify.
# Rationale: this repo is an owned DSH plugin and previously had no workflow;
# publish.yml is intentionally NOT included (npm secret is not uploaded to
# GitHub Actions; releases stay manual until Trusted Publishing is configured).

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify
